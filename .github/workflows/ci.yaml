name: CI

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  test:
    name: test (juju ${{ matrix.juju }}, microk8s)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        juju: ["3.6/stable", "4/stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      # Installs MicroK8s and Juju, and bootstraps a controller on MicroK8s.
      - name: Set up Juju on MicroK8s
        uses: charmed-kubernetes/actions-operator@main
        with:
          provider: microk8s
          channel: 1.36-strict/stable
          juju-channel: ${{ matrix.juju }}
      - run: juju version && juju controllers
      - name: Test
        run: |
          terraform init -input=false
          terraform test
